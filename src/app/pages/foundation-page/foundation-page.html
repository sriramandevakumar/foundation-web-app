<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #f5f5f5;">
  <div style="display: flex; align-items: center;">
    <img src="assets/image.png" alt="Logo" style="height: 48px; margin-right: 16px;">
    <h1 style="margin: 0; font-size: 2rem;">Foundation</h1>
  </div>
  <nav>
    <ul style="list-style: none; display: flex; gap: 24px; margin: 0; padding: 0;">
      <li><a href="#" style="text-decoration: none; color: #333;">Home</a></li>
      <li><a href="#" style="text-decoration: none; color: #333;">About</a></li>
      <li><a href="#" style="text-decoration: none; color: #333;">Services</a></li>
      <li><a href="#" style="text-decoration: none; color: #333;">Contact</a></li>
    </ul>
  </nav>
</header>
<body><!-- Slideshow container -->
<div class="container-fluid">
<ngb-carousel *ngIf="images">
  <ng-template ngbSlide>
    <div class="wrapper">
      <img [src]="images[0]" alt="Random first slide">
    </div>
    <div class="carousel-caption">
      <h3>First Slide</h3>
      <p> Angular 10 Carousel Example </p>
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="wrapper">
      <img [src]="images[1]" alt="Random second slide">
    </div>
    <div class="carousel-caption">
      <h3>Second Slide</h3>
      <p> Check out Techiediaries</p>
    </div>
  </ng-template>
  <ng-template ngbSlide>
    <div class="wrapper">
      <img [src]="images[2]"  alt="Random third slide">
    </div>
    <div class="carousel-caption">
      <h3>Third Slide</h3>
      <p>for full tutorial...</p>
    </div>
  </ng-template>
</ngb-carousel>
</div>

</body>
